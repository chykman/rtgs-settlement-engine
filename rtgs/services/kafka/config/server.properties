# Static part of the single-node KRaft config. entrypoint.sh appends the listener, SASL/SSL and
# credential settings (which depend on environment variables) and writes the result to /tmp/kafka.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@127.0.0.1:9093

# BROKER is the only externally reachable listener. CONTROLLER is bound to loopback.
listeners=BROKER://0.0.0.0:9092,CONTROLLER://127.0.0.1:9093
inter.broker.listener.name=BROKER
controller.listener.names=CONTROLLER
sasl.enabled.mechanisms=PLAIN
sasl.mechanism.inter.broker.protocol=PLAIN

log.dirs=/var/lib/kafka/data
log.retention.hours=168
num.partitions=3
auto.create.topics.enable=false
delete.topic.enable=true
group.initial.rebalance.delay.ms=0

# Single node: replication factor 1 everywhere. Raise these (and add brokers) for a real cluster.
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
default.replication.factor=1
min.insync.replicas=1
