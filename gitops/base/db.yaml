# PostgreSQL: the image bakes in the schema as init scripts (runs once on an empty volume).
apiVersion: v1
kind: Service
metadata:
  name: db
  labels: { app: db }
spec:
  clusterIP: None            # headless: stable DNS name "db" for the single StatefulSet pod
  selector: { app: db }
  ports: [{ name: pg, port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 70            # postgres user in the alpine image
        runAsGroup: 70
        fsGroup: 70
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: rtgs-db
          ports: [{ name: pg, containerPort: 5432 }]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: rtgs-secrets, key: POSTGRES_PASSWORD } }
            - name: PGDATA           # a sub-directory: a fresh volume's lost+found would break initdb
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "rtgs", "-d", "rtgs"] }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "rtgs", "-d", "rtgs"] }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      volumes:
        - { name: run, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
