server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the gateway through cluster DNS so nginx survives gateway restarts.
    # nginx does not use the pod's search domains, so the name must be fully qualified.
    resolver kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;
    set $gateway http://bank-gateway.rtgs.svc.cluster.local:3000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location = /version.txt { default_type text/plain; }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
