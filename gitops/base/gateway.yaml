apiVersion: v1
kind: Service
metadata:
  name: bank-gateway
  labels: { app: bank-gateway }
spec:
  selector: { app: bank-gateway }
  ports: [{ name: http, port: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels: { app: bank-gateway }
  template:
    metadata:
      labels: { app: bank-gateway }
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bank-gateway
          image: rtgs-gateway
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: CORE_URL, value: "http://rtgs-core:4000" }
            - name: INTERNAL_TOKEN
              valueFrom: { secretKeyRef: { name: rtgs-secrets, key: INTERNAL_TOKEN } }
            - name: BANK_KEYS
              valueFrom: { secretKeyRef: { name: rtgs-secrets, key: BANK_KEYS } }
            - name: OPERATOR_KEY
              valueFrom: { secretKeyRef: { name: rtgs-secrets, key: OPERATOR_KEY } }
            - { name: DEMO_MODE, value: "true" }          # exposes sample keys to the console: test only
            - { name: PORT, value: "3000" }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes: [{ name: tmp, emptyDir: {} }]
