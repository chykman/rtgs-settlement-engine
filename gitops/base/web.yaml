apiVersion: v1
kind: Service
metadata:
  name: web
  labels: { app: web }
spec:
  selector: { app: web }
  ports: [{ name: http, port: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      enableServiceLinks: false
      containers:
        - name: web
          image: rtgs-web
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /version.txt, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /version.txt, port: http }
            periodSeconds: 15
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: nginx-conf
          configMap:
            name: web-nginx
            items: [{ key: nginx.conf, path: default.conf }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  ingressClassName: traefik      # K3s ships Traefik; k3d maps host port 8081 to its load balancer
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
