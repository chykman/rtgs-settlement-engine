apiVersion: v1
kind: Service
metadata:
  name: rtgs-core
  labels: { app: rtgs-core }
spec:
  selector: { app: rtgs-core }
  ports: [{ name: http, port: 4000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtgs-core
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1                  # one settlement engine; the database serialises settlement
  selector:
    matchLabels: { app: rtgs-core }
  template:
    metadata:
      labels: { app: rtgs-core }
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsUser: 1000          # "node" in the image
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: rtgs-core
          image: rtgs-core
          ports: [{ name: http, containerPort: 4000 }]
          env:
            - name: POSTGRES_PASSWORD        # must come before DATABASE_URL, which expands it
              valueFrom: { secretKeyRef: { name: rtgs-secrets, key: POSTGRES_PASSWORD } }
            - { name: DATABASE_URL, value: "postgres://rtgs:$(POSTGRES_PASSWORD)@db:5432/rtgs" }
            - name: INTERNAL_TOKEN
              valueFrom: { secretKeyRef: { name: rtgs-secrets, key: INTERNAL_TOKEN } }
            - { name: ALLOW_RESET, value: "true" }       # test platform only
            - { name: PORT, value: "4000" }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes: [{ name: tmp, emptyDir: {} }]
