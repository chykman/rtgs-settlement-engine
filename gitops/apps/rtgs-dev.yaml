apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rtgs-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/chykman/rtgs-settlement-engine.git
    targetRevision: main
    path: gitops/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: rtgs
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    retry: { limit: 10, backoff: { duration: 15s, factor: 2, maxDuration: 5m } }
